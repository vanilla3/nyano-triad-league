<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyano Triad League</title>
    <meta name="description" content="NyanoNFTを使ったカードバトルゲーム。デッキを組んで、対戦し、勝利を共有しよう。" />

    <!-- Bootstrap theme & VFX early (avoid flash of wrong theme / motion) -->
    <script>
      (() => {
        try {
          const params = new URLSearchParams(location.search);
          const theme = (params.get("theme") || localStorage.getItem("nytl.theme") || "mint").trim();
          if (theme) document.documentElement.dataset.theme = theme;
        } catch {}

        try {
          const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const rawPref = (localStorage.getItem("nytl.vfx.quality") || "auto").trim();
          let vfx = rawPref;

          if (reduced) vfx = "off";
          if (vfx === "auto") {
            const mem = navigator.deviceMemory;
            const cores = navigator.hardwareConcurrency;
            if ((typeof mem === "number" && mem < 4) || (typeof cores === "number" && cores < 4)) vfx = "low";
            else if ((typeof mem === "number" && mem >= 8) && (typeof cores === "number" && cores >= 8)) vfx = "high";
            else vfx = "medium";
          }

          if (vfx && vfx !== "auto") document.documentElement.dataset.vfx = vfx;
        } catch {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nyano Triad League" />
    <meta property="og:description" content="NyanoNFTを使ったカードバトルゲーム。デッキを組んで、対戦し、勝利を共有しよう。" />
    <meta property="og:image" content="/og-image.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nyano Triad League" />
    <meta name="twitter:description" content="NyanoNFTを使ったカードバトルゲーム。デッキを組んで、対戦し、勝利を共有しよう。" />
    <meta name="twitter:image" content="/og-image.webp" />

    <!-- Theme color -->
    <meta name="theme-color" content="#1a1b3a" />

    <!-- Arweave gateway preconnect — speeds up NFT card image loading -->
    <link rel="preconnect" href="https://arweave.net" crossorigin />
    <link rel="dns-prefetch" href="https://arweave.net" />
    <link rel="dns-prefetch" href="https://ar-io.dev" />

    <!-- Preload hero background — above-the-fold on home page -->
    <link rel="preload" href="/hero-bg.webp" as="image" type="image/webp" />
    <link rel="preload" href="/nyano.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
